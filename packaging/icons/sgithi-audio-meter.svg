<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b33"/>
      <stop offset="1" stop-color="#1a1a20"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="22" fill="url(#bg)" stroke="#454550" stroke-width="2"/>

  <!-- three fader tracks -->
  <g stroke="#5c5c68" stroke-width="6" stroke-linecap="round">
    <line x1="38" y1="26" x2="38" y2="102"/>
    <line x1="64" y1="26" x2="64" y2="102"/>
    <line x1="90" y1="26" x2="90" y2="102"/>
  </g>

  <!-- filled portion below each knob -->
  <g stroke="#8cc0ff" stroke-width="6" stroke-linecap="round">
    <line x1="38" y1="58" x2="38" y2="102"/>
    <line x1="64" y1="40" x2="64" y2="102"/>
    <line x1="90" y1="70" x2="90" y2="102"/>
  </g>

  <!-- knobs -->
  <g fill="#f2f4ff" stroke="#8cc0ff" stroke-width="2">
    <circle cx="38" cy="58" r="8"/>
    <circle cx="64" cy="40" r="8"/>
    <circle cx="90" cy="70" r="8"/>
  </g>
</svg>
