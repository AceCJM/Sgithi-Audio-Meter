[package]
name = "sgithi-audio-meter"
version = "0.10.1"
edition = "2024"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["gtk_v4_10", "v1_5"], default-features = false }
async-channel = "2.5.0"
env_logger = "0.11.11"
glib = "0.22.9"
gtk = { package = "gtk4", version = "0.11.4" }
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
log = "0.4.34"
pipewire = { version = "0.10.1", features = ["v0_3_44"] }
serde = "1.0.229"
serde_json = "1.0.151"
